name: Bug report
description: Report a reproducible problem in chat-sdk-rs
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Slack
        - Discord
        - CLI
        - Core library
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include logs, errors, versions, or a minimal code sample. Remove secrets before posting.
      render: text
